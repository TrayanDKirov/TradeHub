<div class="register-page">
  <h1 class="register-title">Seller Registration</h1>

  <div class="register-content">
    <form (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-columns">
        <div class="form-column">
          <h3 class="form-section">Seller details</h3>
          <mat-form-field>
            <mat-label>Display name</mat-label>
            <input matInput [(ngModel)]="registerDto.displayName" name="displayName" required>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Contact email</mat-label>
            <input matInput type="email" [(ngModel)]="registerDto.contactEmail" name="contactEmail">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Contact phone</mat-label>
            <input matInput type="tel" [(ngModel)]="registerDto.contactPhone" name="contactPhone">
          </mat-form-field>
          <mat-form-field>
            <mat-label>Description</mat-label>
            <textarea matInput rows="4" [(ngModel)]="registerDto.description" name="description"></textarea>
          </mat-form-field>
        </div>

        <div class="form-column">
          <h3 class="form-section">Account</h3>
          <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput [(ngModel)]="registerDto.username" name="username" required>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput type="email" [(ngModel)]="registerDto.email" name="email" required>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Phone</mat-label>
            <input matInput type="tel" [(ngModel)]="registerDto.phone" name="phone" required>
          </mat-form-field>
          <mat-form-field>
            <mat-label>Enter your password</mat-label>
            <input matInput [type]="hide() ? 'password' : 'text'" [(ngModel)]="registerDto.password" name="password" required/>
            <button
              type="button"
              matIconButton
              matSuffix
              (click)="clickEvent($event)"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide()"
            >
              <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
            </button>
          </mat-form-field>
        </div>
      </div>

      <button matButton="filled">Register as seller</button>
    </form>

    <aside class="register-links">
      <section class="router-link-section">
        <a class="additional-text">You want to register as a Buyer? </a>
        <button matFab extended routerLink="/register/buyer"> Register as a Buyer </button>
      </section>

      <section class="router-link-section">
        <a class="additional-text">You already have a Buyer/Seller account? </a>
        <button matFab extended routerLink="/login"> Go to Login </button>
      </section>
    </aside>
  </div>
</div>
