<form (ngSubmit)="onSubmit()" class="register-form">
  <mat-form-field>
    <mat-label>Username</mat-label>
    <input matInput [(ngModel)]="registerDto.username" name="username">
  </mat-form-field>
  <mat-form-field>
    <mat-label>Enter your password</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" [(ngModel)]="registerDto.password" name="password"/>
    <button
      type="button"
      matIconButton
      matSuffix
      (click)="clickEvent($event)"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
  </mat-form-field>
  <button matButton="filled">Register</button>
</form>

<section class="router-link-section">
  <a class="additional-text">You already have an account?</a>
  <button matFab extended routerLink="/login"> Go to Login </button>
</section>
