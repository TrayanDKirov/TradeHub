<header class="home-toolbar">
  <div class="user-box"
       role="button"
       tabindex="0"
       (click)="openProfile()"
       (keydown.enter)="openProfile()">
    <mat-icon class="user-icon">account_circle</mat-icon>
    <span class="user-name">{{ userPreview?.username }}</span>
  </div>

  @if (userPreview.role.toLowerCase() === 'buyer') {
    <button matButton="outlined" routerLink="/cart">
      <mat-icon>shopping_cart</mat-icon>
      Cart
    </button>
  }

  <button matButton="outlined" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</header>

<section>
  Hello this is TradeHub
</section>

<section class="router-link-section">
  @switch (userPreview.role.toLowerCase()) {
    @case ('buyer') {
      <button matFab extended routerLink="/shops"> Shops </button>
    }
    @case ('seller') {
      <button matFab extended routerLink="/shops/my"> My Shops </button>
      <button matFab extended routerLink="/shops"> All Shops </button>
    }
    @case ('admin') {
      <button matFab extended routerLink="/shops"> Shops </button>
    }
  }
</section>
