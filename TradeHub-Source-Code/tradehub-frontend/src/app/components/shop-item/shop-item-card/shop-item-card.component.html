<mat-card class="card" appearance="outlined">
  <mat-card-header class="card-header">
    <mat-card-title class="card-title">  {{item.name}}  </mat-card-title>
    <mat-card-subtitle class="card-subtitle"> {{item.price | currency:'EUR'}} </mat-card-subtitle>
  </mat-card-header>

  <img mat-card-image [src]="pictureSrc" [alt]="item.name">

  <mat-card-content class="card-description">
    <p>In stock: {{item.quantity}}</p>
  </mat-card-content>

  <mat-card-actions>
    <button matButton (click)="viewItem()">OPEN</button>
  </mat-card-actions>
</mat-card>
