<form class="admin-login-form" (ngSubmit)="login()" #loginForm="ngForm">
  <h2 class="admin-title">Admin Login</h2>

  <mat-form-field>
    <mat-label>Username</mat-label>
    <input matInput type="text" [(ngModel)]="credentials.username" name="username" required>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Password</mat-label>
    <input matInput [type]="hidePassword() ? 'password' : 'text'"
           [(ngModel)]="credentials.password" name="password" required>
    <button matIconSuffix type="button" matIconButton (click)="hidePassword.set(!hidePassword())">
      <mat-icon>{{ hidePassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
  </mat-form-field>

  @if (error()) {
    <p class="error-text">{{ error() }}</p>
  }

  <button matButton="tonal" type="submit" [disabled]="loginForm.invalid">
    <mat-icon>admin_panel_settings</mat-icon>
    Sign in as Admin
  </button>
</form>
